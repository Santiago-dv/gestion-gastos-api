<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Gastos</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f2f5; color: #333; }
        header { background: #2c3e50; color: white; padding: 20px; text-align: center; }
        .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
        .card { background: white; border-radius: 10px; padding: 25px; margin-bottom: 25px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h2 { margin-bottom: 15px; color: #2c3e50; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        button { background: #2c3e50; color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
        button:hover { background: #34495e; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; font-weight: bold; }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .saludable { background: #d4edda; color: #155724; }
        .en-riesgo { background: #fff3cd; color: #856404; }
        .deficit { background: #f8d7da; color: #721c24; }
        .btn-delete { background: #e74c3c; padding: 5px 10px; font-size: 12px; }
        .btn-delete:hover { background: #c0392b; }
        .btn-edit { background: #f39c12; padding: 5px 10px; font-size: 12px; margin-right: 5px; }
        .btn-edit:hover { background: #d68910; }
        .btn-cancelar { background: #95a5a6; margin-left: 10px; }
        .btn-cancelar:hover { background: #7f8c8d; }
        .presupuesto-group { display: flex; gap: 10px; margin-bottom: 10px; }
        .presupuesto-group input { flex: 1; }
        #mensaje { padding: 10px; border-radius: 6px; margin-bottom: 15px; display: none; }
        .exito { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .modo-edicion { border: 2px solid #f39c12; }
        .titulo-form { display: flex; align-items: center; justify-content: space-between; }
    </style>
</head>
<body>

<header>
    <h1>💰 Gestión de Gastos Personales</h1>
</header>

<div class="container">

    <!-- Formulario crear/editar gasto -->
    <div class="card">
        <div class="titulo-form">
            <h2 id="titulo-form">Registrar Gasto</h2>
        </div>
        <div id="mensaje"></div>
        <div class="form-group">
            <label>Descripción</label>
            <input type="text" id="descripcion" placeholder="Ej: Mercado semanal">
        </div>
        <div class="form-group">
            <label>Monto</label>
            <input type="number" id="monto" placeholder="Ej: 50000">
        </div>
        <div class="form-group">
            <label>Categoría</label>
            <select id="categoria">
                <option value="comida">Comida</option>
                <option value="transporte">Transporte</option>
                <option value="ocio">Ocio</option>
                <option value="salud">Salud</option>
                <option value="educacion">Educación</option>
                <option value="otros">Otros</option>
            </select>
        </div>
        <div class="form-group">
            <label>Fecha</label>
            <input type="date" id="fecha">
        </div>
        <button id="btn-principal" onclick="guardarGasto()">Registrar Gasto</button>
        <button class="btn-cancelar" id="btn-cancelar" onclick="cancelarEdicion()" style="display:none">Cancelar</button>
    </div>

    <!-- Lista de gastos -->
    <div class="card">
        <h2>Gastos Registrados</h2>
        <button onclick="cargarGastos()" style="margin-bottom:15px">Actualizar lista</button>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Descripción</th>
                    <th>Monto</th>
                    <th>Categoría</th>
                    <th>Fecha</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-gastos">
                <tr><td colspan="6">No hay gastos registrados</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Análisis financiero -->
    <div class="card">
        <h2>Análisis Financiero</h2>
        <p style="margin-bottom:15px">Define un presupuesto por categoría:</p>
        <div id="presupuestos">
            <div class="presupuesto-group">
                <select class="cat-select">
                    <option value="comida">Comida</option>
                    <option value="transporte">Transporte</option>
                    <option value="ocio">Ocio</option>
                    <option value="salud">Salud</option>
                    <option value="educacion">Educación</option>
                    <option value="otros">Otros</option>
                </select>
                <input type="number" class="limite-input" placeholder="Límite">
            </div>
        </div>
        <button onclick="agregarPresupuesto()" style="margin-bottom:15px; margin-top:10px">+ Agregar categoría</button>
        <button onclick="analizarFinanzas()">Analizar</button>
        <div id="resultado-analisis" style="margin-top:20px"></div>
    </div>

</div>

<script>
    const API = "https://gestion-gastos-api-production.up.railway.app"
    let modoEdicion = false
    let idEditando = null

    function mostrarMensaje(texto, tipo) {
        const el = document.getElementById("mensaje")
        el.textContent = texto
        el.className = tipo
        el.style.display = "block"
        setTimeout(() => el.style.display = "none", 3000)
    }

    async function guardarGasto() {
        const body = {
            descripcion: document.getElementById("descripcion").value,
            monto: parseFloat(document.getElementById("monto").value),
            categoria: document.getElementById("categoria").value,
            fecha: document.getElementById("fecha").value
        }
        try {
            let res
            if (modoEdicion) {
                res = await fetch(`${API}/gastos/${idEditando}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(body)
                })
            } else {
                res = await fetch(`${API}/gastos/`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(body)
                })
            }
            const data = await res.json()
            if (res.ok) {
                mostrarMensaje(modoEdicion ? "Gasto actualizado correctamente" : "Gasto registrado correctamente", "exito")
                cancelarEdicion()
                cargarGastos()
            } else {
                mostrarMensaje("Error: " + JSON.stringify(data.detail), "error")
            }
        } catch (e) {
            mostrarMensaje("Error al conectar con la API", "error")
        }
    }

    function activarEdicion(id, gasto) {
        modoEdicion = true
        idEditando = id
        document.getElementById("descripcion").value = gasto.descripcion
        document.getElementById("monto").value = gasto.monto
        document.getElementById("categoria").value = gasto.categoria
        document.getElementById("fecha").value = gasto.fecha
        document.getElementById("titulo-form").textContent = `Editando gasto #${id}`
        document.getElementById("btn-principal").textContent = "Guardar cambios"
        document.getElementById("btn-cancelar").style.display = "inline-block"
        document.querySelector(".card").classList.add("modo-edicion")
        window.scrollTo({ top: 0, behavior: "smooth" })
    }

    function cancelarEdicion() {
        modoEdicion = false
        idEditando = null
        document.getElementById("descripcion").value = ""
        document.getElementById("monto").value = ""
        document.getElementById("categoria").value = "comida"
        document.getElementById("fecha").value = ""
        document.getElementById("titulo-form").textContent = "Registrar Gasto"
        document.getElementById("btn-principal").textContent = "Registrar Gasto"
        document.getElementById("btn-cancelar").style.display = "none"
        document.querySelector(".card").classList.remove("modo-edicion")
    }

    async function cargarGastos() {
        const res = await fetch(`${API}/gastos/`)
        const data = await res.json()
        const tbody = document.getElementById("tabla-gastos")
        if (!data || data.mensaje) {
            tbody.innerHTML = "<tr><td colspan='6'>No hay gastos registrados</td></tr>"
            return
        }
        tbody.innerHTML = Object.entries(data).map(([id, g]) => `
            <tr>
                <td>${id}</td>
                <td>${g.descripcion}</td>
                <td>$${g.monto.toLocaleString()}</td>
                <td>${g.categoria}</td>
                <td>${g.fecha}</td>
                <td>
                    <button class="btn-edit" onclick='activarEdicion(${id}, ${JSON.stringify(g)})'>Editar</button>
                    <button class="btn-delete" onclick="eliminarGasto(${id})">Eliminar</button>
                </td>
            </tr>
        `).join("")
    }

    async function eliminarGasto(id) {
        await fetch(`${API}/gastos/${id}`, { method: "DELETE" })
        cargarGastos()
    }

    function agregarPresupuesto() {
        const div = document.createElement("div")
        div.className = "presupuesto-group"
        div.innerHTML = `
            <select class="cat-select">
                <option value="comida">Comida</option>
                <option value="transporte">Transporte</option>
                <option value="ocio">Ocio</option>
                <option value="salud">Salud</option>
                <option value="educacion">Educación</option>
                <option value="otros">Otros</option>
            </select>
            <input type="number" class="limite-input" placeholder="Límite">
        `
        document.getElementById("presupuestos").appendChild(div)
    }

    async function analizarFinanzas() {
        const categorias = document.querySelectorAll(".cat-select")
        const limites = document.querySelectorAll(".limite-input")
        const presupuestos = []
        categorias.forEach((cat, i) => {
            if (limites[i].value) {
                presupuestos.push({ categoria: cat.value, limite: parseFloat(limites[i].value) })
            }
        })
        const res = await fetch(`${API}/analisis/`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(presupuestos)
        })
        const data = await res.json()
        if (!res.ok) {
            document.getElementById("resultado-analisis").innerHTML = `<p style="color:red">${data.detail}</p>`
            return
        }

        const estados = Object.values(data.analisis_por_categoria).map(i => i.estado)
        let veredictoGlobal, colorVeredicto, iconoVeredicto
        if (estados.every(e => e === "saludable")) {
            veredictoGlobal = "Tus finanzas están en buen estado"
            colorVeredicto = "#d4edda"
            iconoVeredicto = "✅"
        } else if (estados.some(e => e === "déficit")) {
            veredictoGlobal = "Tienes categorías en déficit, revisa tus gastos"
            colorVeredicto = "#f8d7da"
            iconoVeredicto = "🚨"
        } else {
            veredictoGlobal = "Algunas categorías están en riesgo, ten cuidado"
            colorVeredicto = "#fff3cd"
            iconoVeredicto = "⚠️"
        }

        let html = `
            <div style="background:${colorVeredicto}; padding:15px; border-radius:8px; margin-bottom:15px; text-align:center;">
                <span style="font-size:24px">${iconoVeredicto}</span>
                <p style="font-size:16px; font-weight:bold; margin-top:5px">${veredictoGlobal}</p>
            </div>
            <div style="display:flex; gap:15px; margin-bottom:15px">
                <div style="flex:1; background:#f8f9fa; padding:15px; border-radius:8px; text-align:center;">
                    <p style="color:#555; font-size:13px">Total gastado</p>
                    <p style="font-size:22px; font-weight:bold; color:#2c3e50">$${data.total_general.toLocaleString()}</p>
                </div>
                <div style="flex:1; background:#f8f9fa; padding:15px; border-radius:8px; text-align:center;">
                    <p style="color:#555; font-size:13px">Mayor gasto en</p>
                    <p style="font-size:22px; font-weight:bold; color:#2c3e50">${data.categoria_mayor_gasto}</p>
                </div>
            </div>
            <table><thead><tr><th>Categoría</th><th>Gastado</th><th>Límite</th><th>% Usado</th><th>Estado</th></tr></thead><tbody>`

        for (const [cat, info] of Object.entries(data.analisis_por_categoria)) {
            const clase = info.estado === "saludable" ? "saludable" : info.estado === "en riesgo" ? "en-riesgo" : "deficit"
            const barra = Math.min(info.porcentaje_usado, 100)
            const colorBarra = info.estado === "saludable" ? "#28a745" : info.estado === "en riesgo" ? "#ffc107" : "#dc3545"
            html += `<tr>
                <td>${cat}</td>
                <td>$${info.gastado.toLocaleString()}</td>
                <td>$${info.limite.toLocaleString()}</td>
                <td>
                    <div style="background:#eee; border-radius:4px; height:8px; width:100px">
                        <div style="background:${colorBarra}; width:${barra}%; height:8px; border-radius:4px"></div>
                    </div>
                    <span style="font-size:12px">${info.porcentaje_usado}%</span>
                </td>
                <td><span class="badge ${clase}">${info.estado}</span></td>
            </tr>`
        }
        html += "</tbody></table>"
        document.getElementById("resultado-analisis").innerHTML = html
    }

    cargarGastos()
</script>

</body>
</html>
